<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registration | ShahdFlix</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<nav class="navbar navbar-dark container py-3"><a class="navbar-brand brand" href="index.html">SHAHD MAHMOUD ARAFAT</a><a class="text-white text-decoration-none small" href="login.html">Sign In</a></nav>
<main class="auth-wrap container">
  <form class="auth-card" id="registerForm">
    <h1>Create Account</h1>
    <label class="form-label mt-3" for="fullName">Full name</label><input class="form-control form-control-lg" id="fullName" type="text" placeholder="Your full name" required>
    <label class="form-label mt-3" for="registerEmail">Email</label><input class="form-control form-control-lg" id="registerEmail" type="email" placeholder="Email address" required>
    <label class="form-label mt-3" for="registerPassword">Password</label><input class="form-control form-control-lg" id="registerPassword" type="password" placeholder="At least 6 characters" minlength="6" required>
    <label class="form-label mt-3" for="confirmPassword">Confirm password</label><input class="form-control form-control-lg" id="confirmPassword" type="password" placeholder="Repeat your password" minlength="6" required>
    <button class="btn btn-netflix btn-lg w-100 mt-4" type="submit">Create Account</button>
    <div class="form-message" id="registerMessage" role="status"></div>
    <p class="auth-muted mt-4">Already have an account? <a href="login.html">Sign in</a>.</p>
    <p class="auth-note">Demo only: registration is validated in your browser and is not connected to a real account database.</p>
    <a class="back-home" href="index.html">← Back to Home</a>
  </form>
</main>
<script src="js/main.js"></script></body></html>
