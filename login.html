<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign In | ShahdFlix</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<nav class="navbar navbar-dark container py-3"><a class="navbar-brand brand" href="index.html">SHAHD MAHMOUD ARAFAT</a><a class="text-white text-decoration-none small" href="register.html">Create account</a></nav>
<main class="auth-wrap container">
  <form class="auth-card" id="loginForm">
    <h1>Sign In</h1>
    <label class="form-label mt-3" for="loginEmail">Email</label><input class="form-control form-control-lg" id="loginEmail" type="email" placeholder="Email address" required>
    <label class="form-label mt-3" for="loginPassword">Password</label><input class="form-control form-control-lg" id="loginPassword" type="password" placeholder="Password" minlength="6" required>
    <button class="btn btn-netflix btn-lg w-100 mt-4" type="submit">Sign In</button>
    <div class="form-message" id="loginMessage" role="status"></div>
    <p class="auth-muted mt-4">New to ShahdFlix? <a href="register.html">Sign up now</a>.</p>
    <p class="auth-note">This is a front-end student demo. Login details are not sent to a server.</p>
    <a class="back-home" href="index.html">← Back to Home</a>
  </form>
</main>
<script src="js/main.js"></script></body></html>
